server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  autoindex off;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'none'; connect-src 'self' blob: https://stockx.com https://*.stockx.com; worker-src 'self'; object-src blob:; frame-src blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), display-capture=()" always;
  location / {
    try_files $uri $uri/ =404;
  }
  location ~ /\. { deny all; }
  location = /_headers { deny all; }
}
