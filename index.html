<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Combine StockX order details and a DPD shipping label onto one A4 PDF.">
  <title>StockX label modifier</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <main>
    <h1>StockX label modifier</h1>
    <p class="hint">DPD labels · Maximum 10 MB</p>
    <form id="file-form" aria-label="Convert file">
      <label for="pdf">PDF file</label>
      <input id="pdf" type="file" accept="application/pdf,.pdf" required>
      <button type="submit">Convert file</button>
    </form>
    <div class="divider">or</div>
    <form id="url-form" aria-label="Convert URL">
      <label for="pdf-url">PDF URL</label>
      <input id="pdf-url" type="url" placeholder="https://…" required>
      <button type="submit">Convert URL</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <a id="open" target="_blank" rel="noopener" hidden>Open modified PDF</a>
    <footer>
      PDFs are processed in your browser and never uploaded.<br>
      Not affiliated with StockX. <a href="https://github.com/418Coffee/stockx.418coffee.net" target="_blank" rel="noopener noreferrer">Source code</a>
    </footer>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
